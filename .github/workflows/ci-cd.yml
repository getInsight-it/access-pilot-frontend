name: ci-cd.yml
on:
  push:
    branches:
      - develop

jobs:

  build:
    name: build
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: yarn-build
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          yarn
          yarn build

      - uses: actions/upload-artifact@v5
        with:
          path: dist
          retention-days: 1
          if-no-files-found: 'error'
          include-hidden-files: 'true'
          name: 'dist'

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        with:
          node-version: '22.x'
          cache: 'yarn'

      - run: yarn
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

      - run: yarn lint:report
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        continue-on-error: true

      - uses: ldiego73/eslint-report-action@v1.1
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          report: reports/lint.json

  sonar:
    name: sonar
    environment: dev
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectName=accesspilot-frontend
            -Dsonar.projectKey=accesspilot-frontend
            -Dsonar.exclusions=node_modules/**,dist/**
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  release:
    name: release
    environment: dev
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag_name: ${{ steps.changelog.outputs.tag }}
      version: ${{ steps.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.github_token }}
          git-user-email: 'accesspilot@getinsight.it'
          output-file: "false"

      - uses: actions/create-release@v1
        id: create_release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          release_name: ${{ steps.changelog.outputs.tag }}-${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false

  container:
    name: container
    environment: dev
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}/dist

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-image
        env:
          TAG: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
          LATEST: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          docker buildx create --use --driver docker-container --bootstrap
          export DOCKER_TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          export LATEST_TAG=$(echo "$LATEST" | tr '[:upper:]' '[:lower:]')
          docker buildx build --no-cache --pull --platform linux/amd64,linux/arm64 -f Dockerfile -t "$DOCKER_TAG" -t "$LATEST_TAG" --push .

